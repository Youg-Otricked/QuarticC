name: Build Quartic C

on:
  push:
    branches: [ master ]
    paths:
      - 'version.txt'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version
        id: get_version
        run: echo "version=$(cat version.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags 
          VERSION=$(cat version.txt | tr -d '[:space:]')
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping release steps."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $VERSION is new."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create tag
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag ${{ steps.get_version.outputs.version }}
          git push origin ${{ steps.get_version.outputs.version }}  
  build-linux:
    needs: [tag]
    if: needs.tag.outputs.exists != 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          apt update
          apt install -y llvm-22 llvm-22-dev clang-22 libstdc++-16-dev pkg-config cmake git libzstd-dev libclang-22-dev  libclang-common-22-dev  libclang-cpp22-dev 
      
      - name: Generate runtime.ll
        run: clang++-22 -S -emit-llvm -O0 -o runtime.ll runtime.cpp
      
      - name: Build (Linux)
        run: |
          CC=clang-22 CXX=clang++-22 cmake -DCMAKE_BUILD_TYPE=Release -DCXX_RUNTIME=ON .
          cmake --build . -j$(nproc)
          mv qc qc-linux

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: qc-linux
          path: qc-linux

  build-macos:
    needs: [tag]
    if: needs.tag.outputs.exists != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install llvm@22 cmake        
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> $GITHUB_ENV
          echo "$(brew --prefix llvm@22)/bin" >> $GITHUB_PATH
      - name: Generate runtime.ll
        run: clang -S -emit-llvm -O0 -o runtime.ll runtime.cpp
      - name: Build (macOS)
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=$LLVM_DIR -DCXX_RUNTIME=ON .
          cmake --build . -j$(sysctl -n hw.logicalcpu)
          mv qc qc-macos

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: qc-macos
          path: qc-macos
  upload-extras:
    needs: [tag]
    if: needs.tag.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload stdlib
        uses: actions/upload-artifact@v4
        with:
          name: stdlib.qc
          path: stdlib.qc
      - name: Upload syntax
        uses: actions/upload-artifact@v4
        with:
          name: syntax.qc
          path: syntax.qc
      - name: Upload test
        uses: actions/upload-artifact@v4
        with:
          name: test.qc
          path: test.qc
